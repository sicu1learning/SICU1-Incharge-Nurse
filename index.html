<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            if (window.fetch) {
              var nativeFetch = window.fetch.bind(window);
              var currentFetch = nativeFetch;
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
            if (window.navigator && window.navigator.sendBeacon) {
              var nativeSendBeacon = window.navigator.sendBeacon.bind(window.navigator);
              var currentSendBeacon = nativeSendBeacon;
              try {
                Object.defineProperty(window.navigator, 'sendBeacon', {
                  get: function() {
                    return currentSendBeacon;
                  },
                  set: function(fn) {
                    currentSendBeacon = fn;
                  },
                  configurable: true,
                  enumerable: true
                });
              } catch (_) {}
            }
          }
        } catch (e) {
          console.warn('[Polyfill Guard] Failed to configure global property setters:', e);
        }
      })();
    </script>
    <title>SICU1 Incharge Nurse - ระบบบริหารยอดผู้ป่วย & ส่งต่อเวร</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  </head>
